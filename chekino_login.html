<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<script src="/js/boot.js?v=20261013f" data-mode="login"></script>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>چکینو | ورود</title>
<meta name="description" content="چکینو: پیگیری ثبت چک‌های صیادی، از دریافت از مشتری تا ثبت به نام ذینفع">
<meta name="theme-color" content="#FFFFFF">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='1' y='5' width='30' height='22' rx='6' fill='%230A0A0A'/%3E%3Cpath d='M14 13.5h11M14 18.5h7' stroke='white' stroke-width='2' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="preload" href="/fonts/IRANSansXVFaNum.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/css/shared.css?v=20261013f">
<link rel="stylesheet" href="/css/login.css?v=20261013f">
</head>
<body>

<main class="auth">

  <section class="auth-pane">
    <div class="auth-brand">
      <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true">
        <rect x="1" y="5" width="30" height="22" rx="6" fill="currentColor"/>
        <path d="M9 5v22" stroke="#fff" stroke-opacity=".55" stroke-width="1.4" stroke-dasharray="1.6 2"/>
        <path d="M14 13.5h11M14 18.5h7" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
      </svg>
      <span>چکینو</span>
    </div>

    <div class="card">
      <div class="brand">
        <h1>ورود به حساب شرکت</h1>
        <p>نام کاربری و رمز عبوری را که برای شرکت‌تان ساخته شده وارد کنید.</p>
      </div>

      <div class="alert" id="alertBox" role="alert">
        <svg id="alertIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="7" x2="12" y2="13" stroke-linecap="round"/><circle cx="12" cy="16.3" r="1.1" fill="currentColor" stroke="none"/></svg>
        <span id="alertText">لطفاً نام کاربری و رمز عبور خود را وارد کنید</span>
      </div>

      <form id="loginForm" novalidate>
        <!-- HeroUI's InputGroup: the label above, an icon at the start, and
             for the password the show / hide toggle at the end. -->
        <div class="field" id="usernameField">
          <label for="username">نام کاربری</label>
          <div class="ig has-pre">
            <span class="ig-pre" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg></span>
            <input type="text" id="username" class="latin-digits" placeholder="نام کاربری شرکت" autocomplete="username" dir="ltr" autocapitalize="off" spellcheck="false">
          </div>
          <div class="field-hint" id="userHint" aria-live="polite"></div>
        </div>

        <div class="field" id="passField">
          <label for="password">رمز عبور</label>
          <div class="ig has-pre has-suf">
            <span class="ig-pre" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="11" x="3" y="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg></span>
            <input type="password" id="password" class="latin-digits" placeholder="رمز عبور" autocomplete="current-password" dir="ltr" aria-describedby="passHint">
            <span class="ig-suf has-btn">
              <button type="button" class="ig-btn toggle-eye" id="eyeToggle" aria-label="نمایش رمز عبور" aria-pressed="false">
                <svg id="eyeIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                  <circle cx="12" cy="12" r="3"/>
                </svg>
              </button>
            </span>
          </div>
        </div>

        <div class="field-hint" id="passHint" aria-live="polite"></div>
        <button type="submit" class="submit">ورود به سیستم</button>
      </form>
    </div>

    <p class="auth-foot">حساب ندارید یا رمز را فراموش کرده‌اید؟ <a href="https://t.me/ehsanrafie" target="_blank" rel="noopener noreferrer">به پشتیبانی پیام بدهید</a>.</p>
  </section>

</main>


<script src="/js/shared.js?v=20261013f"></script>
<script src="/js/login.js?v=20261013f"></script>
<script src="/js/field-addons.js?v=20261013f"></script>

</body>
</html>
